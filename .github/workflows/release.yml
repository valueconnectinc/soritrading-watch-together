name: release

# Push a tag `vX.Y.Z` to publish every package at that version.
# Authentication is trusted publishing (GitHub OIDC) — no long-lived registry tokens are stored in this repository,
# except for Maven Central, which has no trusted publishing: it uses a Central Portal token and a GPG key (repository secrets).
# Go needs no registry: push the matching `go/vX.Y.Z` tag and the Go module proxy picks it up.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Every manifest must carry the tag's version
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          fail=0
          check() { if [ "$2" != "$v" ]; then echo "::error::$1 has $2, tag is $v"; fail=1; fi; }
          check js/package.json        "$(node -p "require('./js/package.json').version")"
          check python/pyproject.toml  "$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)"
          check rust/Cargo.toml        "$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          check dotnet/WatchTogether   "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/WatchTogether/WatchTogether.csproj)"
          check jvm/pom.xml            "$(sed -n 's:^  <version>\(.*\)</version>:\1:p' jvm/pom.xml)"
          exit $fail

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: cp LICENSE js/LICENSE
      - run: node --test test/conformance.test.mjs
        working-directory: js
      - run: npm publish
        working-directory: js

  pypi:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: cp LICENSE python/LICENSE
      - run: python -m unittest discover -s tests
        working-directory: python
      - run: python -m pip install build && python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  crates:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: cp LICENSE rust/LICENSE
      - run: cargo test
        working-directory: rust
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --allow-dirty
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  nuget:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run --project dotnet/Conformance -- conformance
      - run: dotnet pack dotnet/WatchTogether -c Release -o artifacts
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  maven:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - run: java tools/Build.java
        working-directory: jvm
      - name: mvn deploy (skipped until the Maven Central secrets exist — see RELEASING.md)
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ]; then echo "::warning::MAVEN_CENTRAL_USERNAME is not set; Maven Central publish skipped"; exit 0; fi
          mvn -B -P release deploy
        working-directory: jvm
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
